version: '3.8'

services:
  # 1. Database MySQL
  auth_db:
    image: mysql:8.0
    container_name: auth_mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: auth_db
    ports:
      - '3307:3306'
    volumes:
      - auth_mysql_data:/var/lib/mysql

  # 2. Redis (Caching & Presence)
  auth_redis:
    image: redis:alpine
    container_name: auth_redis_container
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes

  # 3. RabbitMQ (Messaging)
  auth_rabbitmq:
    image: rabbitmq:3-management
    container_name: auth_rabbitmq_container
    restart: always
    ports:
      - '5672:5672' # Port komunikasi
      - '15672:15672' # UI Management Dashboard
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password

volumes:
  auth_mysql_data: